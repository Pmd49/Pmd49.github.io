<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Knowledge Race — Máy đội chơi</title>
<style>
:root{--bg:#0b1220;--panel:#142138;--line:#293953;--text:#f3f7ff;--muted:#9fb0ca;--gold:#ffd166;--green:#48d6a0;--red:#ff7777;--blue:#65a9ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at top,#1a3052 0%,var(--bg) 62%);color:var(--text);font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;
 padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input{font:inherit}
button{border:0;border-radius:14px;padding:14px 18px;font-weight:800;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45}
.hidden{display:none!important}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-weight:900;letter-spacing:.04em;font-size:15px}
.conn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:#111d30;border:1px solid var(--line);padding:5px 10px;border-radius:999px}
.conn i{width:9px;height:9px;border-radius:50%;background:#777;display:block}
.conn.ok i{background:var(--green)}.conn.connecting i{background:var(--gold)}.conn.lost i{background:var(--red)}
.card{background:linear-gradient(180deg,#142138f5,#101a2bf5);border:1px solid var(--line);border-radius:20px;padding:20px}
h1{font-size:24px;margin:0 0 6px;line-height:1.2;text-wrap:balance}
p{color:var(--muted);line-height:1.5;margin:0 0 14px}
label{display:block;font-size:12px;font-weight:800;color:#a9bbd4;letter-spacing:.08em;margin-bottom:6px}
#codeInput{width:100%;font-size:34px;font-weight:900;letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:12px;background:#0c1626;border:2px solid #344762;border-radius:14px;color:var(--gold)}
#codeInput:focus{outline:3px solid #65a9ff66;border-color:var(--blue)}
.primary{background:linear-gradient(135deg,#4e9cff,#3674e8);color:#fff;width:100%;font-size:18px;margin-top:14px;box-shadow:0 6px 18px #3674e833}
.secondary{background:#253550;color:#eaf1ff;border:1px solid #3b4d69}
.err{color:#ffb3c0;font-weight:700;margin-top:12px;min-height:1.2em}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbtn{display:flex;align-items:center;gap:10px;background:#17263c;color:var(--text);border:2px solid #344b69;text-align:left;padding:12px;min-width:0}
.tbtn .dot{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#07111f;font-weight:900;border:2px solid #fff}
.tbtn span.n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn small{display:block;color:var(--muted);font-weight:600;font-size:11px}
.tbtn:disabled{opacity:.4}
.me{display:flex;align-items:center;gap:12px}
.me .dot{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#07111f;font-weight:900;font-size:20px;flex:none}
.me b{display:block;font-size:20px}
.me span{color:var(--muted);font-size:13px}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:#101a2a;border:1px solid #273953;border-radius:12px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;min-height:300px}
.panel h2{margin:0;font-size:24px;line-height:1.25;text-wrap:balance}
.panel p{margin:0}
.big{font-size:64px;line-height:1}
.claim{position:relative;width:min(70vw,300px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ffe9a8,#ffc43d 55%,#d98a00);color:#2a1c00;font-size:clamp(22px,7vw,30px);font-weight:900;line-height:1.15;box-shadow:0 14px 40px #ffb30055,inset 0 -10px 24px #0004;padding:10px;animation:pulse 0.9s ease-in-out infinite}
.claim small{display:block;font-size:.55em;font-weight:800;opacity:.8;margin-top:4px}
.claim:active{transform:scale(.96)}
.claim:disabled{animation:none;opacity:1;background:radial-gradient(circle at 35% 28%,#b8f5d9,#48d6a0 60%,#1f9c72);color:#06281d}
@keyframes pulse{0%,100%{box-shadow:0 14px 40px #ffb30055,0 0 0 0 #ffd16688}50%{box-shadow:0 14px 40px #ffb30055,0 0 0 18px #ffd16600}}
.count{font-size:44px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.bar{width:min(70vw,300px);height:8px;background:#26364d;border-radius:99px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,#ffd166,#ff9d5c);width:100%}
.win{color:var(--green)}.lose{color:var(--red)}
.muted{color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;width:100%;max-width:320px;background:#0f1a2a;border-radius:10px;padding:8px 12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#f0f5ff;color:#142033;padding:10px 16px;border-radius:12px;font-weight:800;max-width:90vw;text-align:center;z-index:9}
.link{background:none;color:var(--muted);text-decoration:underline;font-weight:600;padding:8px;margin:0 auto}
@media (prefers-reduced-motion:reduce){.claim{animation:none}}
</style>
</head>
<body>
<div id="app">
 <div class="top"><div class="brand">🏁 KNOWLEDGE RACE</div><div class="conn" id="conn"><i></i><span id="connTxt">Chưa kết nối</span></div></div>

 <section class="card" id="sJoin">
  <h1>Vào phòng chơi</h1>
  <p>Nhập mã phòng đang hiện trên màn hình của quản trò.</p>
  <label for="codeInput">MÃ PHÒNG</label>
  <input id="codeInput" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="ABC123">
  <button class="primary" id="joinBtn">Vào phòng</button>
  <div class="err" id="joinErr" role="alert"></div>
 </section>

 <section class="card hidden" id="sPick">
  <h1>Chọn quân cờ của đội bạn</h1>
  <p>Mỗi đội chỉ dùng một điện thoại. Đội đã có máy sẽ bị khóa.</p>
  <div class="teams" id="teamGrid"></div>
 </section>

 <section class="hidden" id="sMain" style="display:flex;flex-direction:column;gap:14px;flex:1">
  <div class="card">
   <div class="me"><div class="dot" id="meDot"></div><div><b id="meName"></b><span id="meSub"></span></div></div>
   <div class="stats"><div class="stat"><b id="stC">0</b><span>ĐÚNG</span></div><div class="stat"><b id="stW">0</b><span>SAI</span></div><div class="stat"><b id="stP">1</b><span>Ô</span></div></div>
  </div>
  <div class="card panel" id="panel"></div>
  <button class="link" id="changeBtn">Đổi đội</button>
 </section>
</div>
<div class="toast hidden" id="toast"></div>
<script>
/* ===== NETLIB: dùng chung cho máy quản trò và máy người chơi ===== */
const KR_PEER_SRC=["https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js","https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"];
const KR_PEER_OPTS={debug:0,config:{iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:"stun:stun.cloudflare.com:3478"}]}};
const KR_ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const krGenCode=()=>Array.from({length:6},()=>KR_ALPHA[Math.floor(Math.random()*KR_ALPHA.length)]).join("");
const krPeerId=c=>"krace-"+String(c).toLowerCase();
function krLoadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>{s.remove();no(new Error("không tải được "+src))};document.head.appendChild(s)})}
async function krLoadPeer(){if(window.Peer)return;let err;for(const src of KR_PEER_SRC){try{await krLoadScript(src);if(window.Peer)return}catch(e){err=e}}throw err||new Error("Không tải được PeerJS")}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S={code:"",cid:"",peer:null,conn:null,open:false,ping:null,retry:null,state:null,phase:"idle",qid:0,deadline:0,total:5000,claimed:false,locked:false,by:"",result:null,done:null,myMs:null,idleT:null,connecting:false};
try{S.cid=localStorage.getItem("kr_cid")||"";if(!S.cid){S.cid=Math.random().toString(36).slice(2,12);localStorage.setItem("kr_cid",S.cid)}}catch(e){S.cid=S.cid||Math.random().toString(36).slice(2,12)}
function toast(m){const t=$("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add("hidden"),2600)}
function setConn(k,txt){const c=$("conn");c.className="conn "+k;$("connTxt").textContent=txt||({ok:"Đã kết nối",connecting:"Đang kết nối…",lost:"Mất kết nối",off:"Chưa kết nối"}[k])}
function show(id){["sJoin","sPick","sMain"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function send(m){try{if(S.conn&&S.conn.open)S.conn.send(m)}catch(e){}}
function joinFail(msg){S.connecting=false;stopPing();S.open=false;$("joinErr").textContent=msg;setConn("off");if(!S.state)show("sJoin");cleanupPeer()}
function cleanupPeer(){try{S.conn&&S.conn.close()}catch(e){}try{S.peer&&S.peer.destroy()}catch(e){}S.conn=null;S.peer=null}
function stopPing(){clearInterval(S.ping);S.ping=null}

async function connect(code){
 code=String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
 if(code.length<4){$("joinErr").textContent="Mã phòng chưa đúng.";return}
 if(S.connecting)return;
 S.connecting=true;S.code=code;$("joinErr").textContent="";setConn("connecting");$("joinBtn").disabled=true;
 cleanupPeer();
 try{await krLoadPeer()}catch(e){$("joinBtn").disabled=false;joinFail("Không tải được thư viện kết nối. Kiểm tra mạng rồi thử lại.");return}
 $("joinBtn").disabled=false;
 let peer;
 try{peer=new window.Peer(undefined,KR_PEER_OPTS)}catch(e){joinFail("Trình duyệt không hỗ trợ kết nối.");return}
 S.peer=peer;
 peer.on("open",()=>{
  if(S.peer!==peer)return;
  const conn=peer.connect(krPeerId(code),{reliable:true,serialization:"json"});S.conn=conn;
  const to=setTimeout(()=>{if(S.conn===conn&&!conn.open)joinFail(`Không nối được tới phòng ${code}. Kiểm tra mã phòng hoặc nhờ quản trò mở phòng.`)},14000);
  conn.on("open",()=>{clearTimeout(to);S.connecting=false;S.open=true;try{localStorage.setItem("kr_code",code)}catch(e){}
   send({t:"hi",cid:S.cid});setConn("ok");stopPing();S.ping=setInterval(()=>send({t:"ping"}),4000)});
  conn.on("data",onMsg);
  conn.on("close",()=>{clearTimeout(to);if(S.conn!==conn)return;S.open=false;S.connecting=false;stopPing();setConn("lost");scheduleRetry()});
  conn.on("error",()=>{});
 });
 peer.on("error",err=>{
  if(S.peer!==peer)return;
  if(err&&err.type==="peer-unavailable")joinFail(`Không tìm thấy phòng ${code}. Kiểm tra mã hoặc chờ quản trò mở phòng.`);
  else if(!S.open){joinFail("Lỗi mạng khi kết nối ("+((err&&err.type)||"không rõ")+"). Thử lại.")}
 });
}
function scheduleRetry(){clearTimeout(S.retry);S.retry=setTimeout(()=>{if(!S.open&&S.code){S.connecting=false;connect(S.code)}},1800)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.code&&!S.open&&!S.connecting)connect(S.code)});

function onMsg(m){
 if(!m||typeof m!=="object")return;
 switch(m.t){
  case"state":S.state=m;if(m.you===null){show("sPick");renderPick()}else{show("sMain")}render();break;
  case"pickfail":toast(m.reason||"Không chọn được đội này.");break;
  case"kicked":toast("Quản trò đã gỡ máy này khỏi đội.");break;
  case"steal_open":clearTimeout(S.idleT);Object.assign(S,{phase:"steal",qid:m.qid,by:m.by,total:m.total,deadline:performance.now()+m.left,claimed:false,locked:false,result:null,myMs:null});try{navigator.vibrate&&navigator.vibrate([80,40,80])}catch(e){}render();break;
  case"steal_tick":if(S.phase==="steal"&&m.qid===S.qid)S.deadline=performance.now()+m.left;break;
  case"steal_claimed":S.claimed=true;S.myMs=m.ms;render();break;
  case"steal_locked":if(S.phase==="steal"){S.locked=true;render()}break;
  case"steal_result":S.phase="result";S.result=m;render();break;
  case"steal_none":S.phase="none";render();idleLater(3800);break;
  case"steal_done":S.phase="done";S.done=m;render();idleLater(6000);break;
  case"steal_owner":clearTimeout(S.idleT);S.phase="owner";S.by=m.by;render();break;
  case"steal_watch":clearTimeout(S.idleT);S.phase="watch";S.by=m.by;render();break;
  case"steal_rej":toast(m.reason||"Chưa ghi nhận được.");break;
  case"over":S.phase="idle";render();break;
 }
}
function idleLater(ms){clearTimeout(S.idleT);S.idleT=setTimeout(()=>{S.phase="idle";render()},ms)}

function renderPick(){
 const g=$("teamGrid");g.innerHTML="";
 (S.state.teams||[]).forEach(t=>{
  const b=document.createElement("button");b.className="tbtn";b.disabled=t.taken;
  b.innerHTML=`<span class="dot" style="background:${esc(t.color)}">${t.id+1}</span><span class="n">${esc(t.name)}<small>${t.taken?"Đã có máy":"Chọn đội này"}</small></span>`;
  b.onclick=()=>send({t:"pick",team:t.id});g.appendChild(b);
 });
}
function render(){
 const st=S.state;if(!st)return;
 if(st.you===null){renderPick();return}
 const me=(st.teams||[]).find(t=>t.id===st.you)||{name:"",color:"#888",id:0};
 $("meDot").style.background=me.color;$("meDot").textContent=me.id+1;$("meName").textContent=me.name;
 $("meSub").textContent=st.turn?`Lượt của ${st.turn.name}`:(st.over?"Ván đã kết thúc":"Chờ quản trò bắt đầu");
 const s=st.stats||{correct:0,wrong:0,pos:1};
 $("stC").textContent=s.correct;$("stW").textContent=s.wrong;$("stP").textContent=s.finished?"🏁":s.pos;
 const p=$("panel");
 const ph=S.phase;
 if(ph==="steal"){
  if(S.claimed){p.innerHTML=`<div class="big">✅</div><h2 class="win">Đã gửi!</h2><p>Chờ kết quả từ quản trò…</p>`}
  else{p.innerHTML=`<p>${S.locked?`<b>Một đội đã bấm trước</b> — bạn vẫn kịp bấm!`:`<b>${esc(S.by)}</b> vừa trả lời sai.`}</p><button class="claim" id="claimBtn">GIÀNH QUYỀN<small>TRẢ LỜI</small></button><div class="count" id="cnt"></div><div class="bar"><div id="cbar"></div></div>`;
   const b=$("claimBtn");b.addEventListener("pointerdown",e=>{e.preventDefault();claim()})}
 }else if(ph==="result"&&S.result){
  const r=S.result;
  if(r.won)p.innerHTML=`<div class="big">🎉</div><h2 class="win">Bạn giành được quyền!</h2><p>Thời gian của bạn: <b>${(r.ms/1000).toFixed(2)}s</b>${r.total>1?` · nhanh nhất trong ${r.total} đội`:""}.<br>Hãy đọc đáp án cho quản trò.</p>`;
  else if(r.owner)p.innerHTML=`<div class="big">⏳</div><h2>${esc(r.winner)} giành quyền</h2><p>Đội bạn đã trả lời sai. Chờ kết quả.</p>`;
  else if(r.ms!==null)p.innerHTML=`<div class="big">⏱️</div><h2 class="lose">${esc(r.winner)} nhanh hơn</h2><p>Bạn: <b>${(r.ms/1000).toFixed(2)}s</b> · nhanh nhất: <b>${(r.best/1000).toFixed(2)}s</b></p>`;
  else p.innerHTML=`<div class="big">⏱️</div><h2>${esc(r.winner)} giành quyền</h2><p>Bạn chưa bấm kịp lần này.</p>`;
 }else if(ph==="done"&&S.done){
  const d=S.done;
  p.innerHTML=`<div class="big">${d.ok?"✅":"❌"}</div><h2 class="${d.ok?"win":"lose"}">${esc(d.team)} trả lời ${d.ok?"đúng":"chưa đúng"}</h2><p>${d.ok?"Đội giành quyền được +1 câu đúng.":"Đáp án đang hiện trên màn hình."}</p>`;
 }else if(ph==="none"){p.innerHTML=`<div class="big">⌛</div><h2>Không đội nào giành quyền</h2><p>Đáp án đang hiện trên màn hình.</p>`}
 else if(ph==="owner"){p.innerHTML=`<div class="big">🛡️</div><h2>Đội bạn trả lời chưa đúng</h2><p>Các đội khác đang tranh quyền trả lời.</p>`}
 else if(ph==="watch"){p.innerHTML=`<div class="big">👀</div><h2>${esc(S.by)} trả lời sai</h2><p>Máy này chưa thuộc đội nào.</p>`}
 else{p.innerHTML=`<div class="big">${st.enabled===false?"💤":"👀"}</div><h2>${st.enabled===false?"Tranh quyền đang tắt":"Sẵn sàng tranh quyền"}</h2><p>${st.enabled===false?"Quản trò chưa bật tính năng này.":"Khi một đội khác trả lời sai, nút giành quyền sẽ hiện ra ở đây. Bạn có "+(st.sec||5)+" giây để bấm."}</p>`}
}
function claim(){
 if(S.phase!=="steal"||S.claimed)return;
 S.claimed=true;send({t:"claim",qid:S.qid});try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
 render();
}
function frame(){
 if(S.phase==="steal"&&!S.claimed){
  const left=Math.max(0,S.deadline-performance.now()),c=$("cnt"),b=$("cbar");
  if(c)c.textContent=S.locked?"⚡":(left/1000).toFixed(1)+"s";
  if(b&&!S.locked)b.style.width=(left/S.total*100)+"%";
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
$("changeBtn").onclick=()=>{send({t:"unpick"})};
$("joinBtn").onclick=()=>connect($("codeInput").value);
$("codeInput").addEventListener("keydown",e=>{if(e.key==="Enter")connect($("codeInput").value)});
(function init(){
 let code="";
 const m=(location.hash+location.search).match(/(?:join|room)=([A-Za-z0-9]{4,8})/);
 if(m)code=m[1];
 else{try{code=localStorage.getItem("kr_code")||""}catch(e){}}
 $("codeInput").value=code.toUpperCase();
 if(m)connect(code);
})();
</script>
</body>
</html>
